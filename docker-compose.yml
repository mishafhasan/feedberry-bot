# Oracle Cloud Always Free is the primary host, a home mini-PC/Pi the fallback (ADR-017).
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
      RSSHUB_BASE: http://rsshub:1200
      # .env is this service's env_file, so a secret that belongs to the RSSHub sidecar (ADR-006)
      # must be cleared here or compose injects it into the bot as well.
      INSTAGRAM_COOKIE: ""
      FACEBOOK_COOKIE: ""
      # TWITTER_AUTH_TOKEN deliberately stays: the media extractor signs in to X with it.
    volumes:
      - ./data:/data
    # Media never survives the job that downloaded it (§5.5, stage 9), so keep it in RAM.
    tmpfs:
      - /tmp/feedberry-media:size=512m
    depends_on:
      rsshub:
        condition: service_healthy

  rsshub:
    # No Chromium (ADR-006): the lighter image is enough for every route in the §10 matrix.
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: "300"
      # X profile feeds need a logged-in account's cookie; absent, only single posts are downloadable.
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      # ADR-006: instance-wide credentials live here, never in the bot. The Instagram route scrapes
      # as a guest without it, which a datacenter IP gets throttled for; only sessionid and
      # ds_user_id are needed ("sessionid=...; ds_user_id=...").
      INSTAGRAM_COOKIE: ${INSTAGRAM_COOKIE:-}
      # The Facebook route asks facebook.com/api/graphql anonymously, and Facebook rate-limits that
      # per IP: a cloud host gets "Facebook GraphQL failed: Rate limit exceeded" while a home line does
      # not. A logged-in session lifts it; RSSHub then also sends the fb_dtsg it fetches with it.
      FACEBOOK_COOKIE: ${FACEBOOK_COOKIE:-}
    volumes:
      - ./rsshub-cache:/app/.cache
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:1200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      start_period: 30s
